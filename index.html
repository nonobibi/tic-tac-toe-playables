<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#10152b">
<title>Tic Tac Toe — Neon Arena</title>
<script src="https://bridge.playgama.com/v2/stable/playgama-bridge.js"></script>

<style>
:root{
color-scheme:dark;
--bg:#0b1020;
--panel:#151d36;
--panel2:#1d2948;
--ink:#f5f7ff;
--muted:#a9b5d1;
--cyan:#54e5ff;
--pink:#ff6eb4;
--gold:#ffd166;
--line:#334365
}

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent
}

html,body{
margin:0;
min-height:100%;
width:100%;
background:radial-gradient(ellipse at 50% -10%,#263967 0,#111a33 42%,var(--bg) 78%);
color:var(--ink);
font-family:Inter,system-ui,Arial,sans-serif
}

body{
min-height:100svh;
display:flex;
justify-content:center;
align-items:center;
padding:14px
}

button{
font:inherit;
color:inherit;
cursor:pointer;
touch-action:manipulation
}

#app{
width:min(100%,700px);
margin:auto
}

.screen{
display:flex;
flex-direction:column;
align-items:center;
gap:18px;
text-align:center
}

.hidden{display:none!important}

.brand{
font-size:clamp(12px,2vw,14px);
font-weight:900;
letter-spacing:.22em;
color:var(--cyan);
text-transform:uppercase
}

h1{
font-size:clamp(38px,9vw,66px);
line-height:.98;
letter-spacing:-.06em;
margin:0;
font-weight:1000
}

h1 span{color:var(--cyan)}

.subtitle{
margin:0;
color:var(--muted);
font-size:15px
}

.panel{
width:min(100%,480px);
padding:clamp(16px,4vw,24px);
background:linear-gradient(145deg,rgba(29,41,72,.96),rgba(18,27,49,.96));
border:1px solid #35476d;
border-radius:24px;
box-shadow:0 22px 65px #0006
}

.menu{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.btn{
border:1px solid #42567f;
background:#243252;
border-radius:15px;
padding:15px 12px;
font-weight:850;
transition:transform .12s,border-color .12s,filter .12s
}

.btn:active{transform:scale(.97)}

.btn.primary{
grid-column:1/-1;
background:linear-gradient(100deg,#25bddc,#4778f5);
border:0;
color:#071326
}

.btn:hover{
filter:brightness(1.12);
border-color:var(--cyan)
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
width:min(100%,480px)
}

.stat{
background:#151f39;
border:1px solid #2c3c60;
border-radius:15px;
padding:12px 5px
}

.stat b{
display:block;
font-size:24px;
color:var(--cyan)
}

.stat span{
font-size:11px;
color:var(--muted);
font-weight:800;
text-transform:uppercase;
letter-spacing:.1em
}

.hint{
font-size:12px;
color:var(--muted);
margin:0
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
width:min(100%,500px);
gap:12px
}

.topbar button,.textbtn{
background:transparent;
border:0;
color:var(--muted);
font-weight:800;
padding:9px 2px
}

.mode-pill{
background:#1a2847;
border:1px solid #35476d;
border-radius:999px;
padding:8px 13px;
font-size:12px;
font-weight:900;
color:var(--cyan)
}

.turn{
font-size:clamp(19px,4vw,25px);
font-weight:950;
min-height:32px
}

.turn small{
font-size:12px;
color:var(--muted);
display:block;
font-weight:600;
margin-top:3px
}

/* Board size stays fixed */
.board-wrap{
width:min(88vw,450px,53vh);
padding:10px;
border-radius:25px;
background:linear-gradient(135deg,#40557e,#1b2949);
box-shadow:0 20px 50px #0006;
flex-shrink:0
}

/* Fixed 3x3 grid */
.board{
width:100%;
aspect-ratio:1;
display:grid;
grid-template-columns:repeat(3,minmax(0,1fr));
grid-template-rows:repeat(3,minmax(0,1fr));
gap:9px;
flex-shrink:0
}

/* Cells never shrink or scale when selected */
.cell{
border:1px solid #35496f;
border-radius:17px;
background:linear-gradient(145deg,#202e50,#15213d);
display:flex;
align-items:center;
justify-content:center;
min-width:0;
min-height:0;
width:100%;
height:100%;
aspect-ratio:1;
font-size:clamp(54px,15vw,100px);
font-weight:1000;
line-height:1;
box-shadow:inset 0 1px #ffffff0c;
transform:none!important;
animation:none!important
}

.cell:disabled{
cursor:default;
opacity:1
}

.cell.x{
color:var(--cyan);
text-shadow:0 0 25px #54e5ff70
}

.cell.o{
color:var(--pink);
text-shadow:0 0 25px #ff6eb470
}

/* Disable click animation */
.cell.pop{
animation:none!important;
transform:none!important
}

@keyframes pop{
0%{transform:none;opacity:1}
100%{transform:none;opacity:1}
}

.cell.winner{
background:linear-gradient(145deg,#3d4770,#263a60);
border-color:var(--gold);
box-shadow:0 0 22px #ffd16655,inset 0 0 18px #ffd16622
}

.result{
font-size:clamp(23px,6vw,34px);
font-weight:1000;
min-height:38px;
color:var(--gold)
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
justify-content:center
}

.controls .btn{padding:12px 17px}

.btn.secondary{background:#1c2947}

.btn.ad{
background:#4b315b;
border-color:#8957a7;
color:#ffe1ff
}

.notice{
min-height:18px;
color:var(--muted);
font-size:12px
}

#pauseOverlay{
position:fixed;
inset:0;
background:#080d1beF;
z-index:5;
display:grid;
place-items:center;
padding:20px
}

.pausebox{
width:min(100%,340px);
padding:28px;
background:var(--panel);
border:1px solid var(--line);
border-radius:22px;
display:grid;
gap:16px
}

.pausebox h2{
margin:0;
font-size:32px
}

@media(max-height:650px){
body{padding:8px}
.screen{gap:10px}
.board-wrap{width:min(68vw,42vh,380px)}
.panel{padding:14px}
.stats{gap:6px}
.stat{padding:7px}
.stat b{font-size:19px}
}

@media(max-width:390px){
.menu{grid-template-columns:1fr}
.btn.primary{grid-column:auto}
.board-wrap{width:min(88vw,48vh)}
}
</style>
</head>

<body>

<main id="app">

<section id="home" class="screen">

<div class="brand">◆ Play • Think • Win ◆</div>

<h1>TIC <span>TAC</span><br>TOE</h1>

<p class="subtitle">A classic face-off. A fresh neon arena.</p>

<div class="panel">
<div class="menu">

<button class="btn primary" data-mode="2p">👥 Two Players</button>
<button class="btn" data-mode="easy">Easy AI</button>
<button class="btn" data-mode="medium">Medium AI</button>

<button class="btn" data-mode="hard"
style="grid-column:1/-1;width:calc(50% - 5px);justify-self:center">
Hard AI
</button>

</div>
</div>

<div class="stats">
<div class="stat"><b id="wins">0</b><span>Wins</span></div>
<div class="stat"><b id="draws">0</b><span>Draws</span></div>
<div class="stat"><b id="losses">0</b><span>Losses</span></div>
</div>

<p class="hint">X starts first · Works on phones, tablets and desktop</p>

</section>

<section id="game" class="screen hidden">

<div class="topbar">

<button id="backBtn">← Menu</button>

<span id="modeLabel" class="mode-pill">TWO PLAYERS</span>

<div style="display:flex;align-items:center;gap:10px">
<button id="soundBtn" aria-label="Turn sound off">🔊 Sound</button>
<button id="pauseBtn">Ⅱ Pause</button>
</div>

</div>

<div id="status" class="turn">
X's turn
<small>Choose a square</small>
</div>

<div class="board-wrap">
<div id="board" class="board" role="grid" aria-label="Tic Tac Toe board"></div>
</div>

<div id="result" class="result" aria-live="polite"></div>

<div class="controls">
<button id="newRound" class="btn primary">↻ New Round</button>
<button id="hintBtn" class="btn ad">▶ Watch ad for a hint</button>
</div>

<div id="notice" class="notice" aria-live="polite"></div>

</section>
</main>

<div id="pauseOverlay" class="hidden">
<div class="pausebox">
<h2>Game paused</h2>
<p class="subtitle">Take a break. Your round is safe.</p>
<button id="resumeBtn" class="btn primary">Resume game</button>
</div>
</div>

<script>
'use strict';

(() => {

const $ = id => document.getElementById(id);

const home=$('home'),
game=$('game'),
boardEl=$('board'),
statusEl=$('status'),
resultEl=$('result');

const pauseOverlay=$('pauseOverlay'),
noticeEl=$('notice');

const WINS=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

const DEFAULTS={
version:2,
wins:0,
draws:0,
losses:0
};

let stats={...DEFAULTS},
bridge=null,
bridgeReady=false,
mode='2p';

let cells=Array(9).fill(''),
turn='X',
over=false,
thinking=false,
paused=false;

let aiTimer=null,
roundsSinceAd=0,
hintAvailable=false,
winningLine=[];

let soundOn=true,
audioCtx=null;

const isBridge=()=>bridgeReady && bridge;

function setNotice(msg){
noticeEl.textContent=msg||'';
}

// Original sound effects synthesized using Web Audio.
function getAudioContext(){
if(!soundOn)return null;

try{
const AudioContextClass=window.AudioContext||window.webkitAudioContext;
if(!AudioContextClass)return null;

if(!audioCtx)audioCtx=new AudioContextClass();

if(audioCtx.state==='suspended')audioCtx.resume();

return audioCtx;
}catch(e){
return null;
}
}

function beep(freq=440,duration=.09,type='sine',volume=.045,delay=0){

const ctx=getAudioContext();
if(!ctx)return;

try{

const start=ctx.currentTime+delay,
osc=ctx.createOscillator(),
gain=ctx.createGain();

osc.type=type;
osc.frequency.setValueAtTime(freq,start);

gain.gain.setValueAtTime(.0001,start);
gain.gain.exponentialRampToValueAtTime(volume,start+.012);
gain.gain.exponentialRampToValueAtTime(.0001,start+duration);

osc.connect(gain);
gain.connect(ctx.destination);

osc.start(start);
osc.stop(start+duration+.02);

}catch(e){}
}

function playMove(isO=false){
beep(isO?520:660,.075,'sine',.035)
}

function playWin(){
[523,659,784,1047].forEach((f,i)=>
beep(f,.17,'triangle',.045,i*.105)
)
}

function playDraw(){
[440,392,349].forEach((f,i)=>
beep(f,.16,'sine',.035,i*.13)
)
}

function updateSoundButton(){

const b=$('soundBtn');
if(!b)return;

b.textContent=soundOn?'🔊 Sound':'🔇 Muted';

b.setAttribute(
'aria-label',
soundOn?'Turn sound off':'Turn sound on'
);
}

function renderStats(){

$('wins').textContent=stats.wins;
$('draws').textContent=stats.draws;
$('losses').textContent=stats.losses;

}

async function saveStats(){

if(isBridge()){
try{
await bridge.storage.set(
['ttt_stats_v2'],
[JSON.stringify(stats)]
);
return;
}catch(e){}
}

try{
if(!bridgeReady)
localStorage.setItem('ttt_stats_v2',JSON.stringify(stats));
}catch(e){}
}

async function loadStats(){

if(isBridge()){

try{
const values=await bridge.storage.get(['ttt_stats_v2']);

if(values&&values[0]){
const parsed=JSON.parse(values[0]);

if(parsed&&parsed.version===2)
stats={...DEFAULTS,...parsed};
}

}catch(e){}

}else{

try{
const raw=localStorage.getItem('ttt_stats_v2');

if(raw){
const parsed=JSON.parse(raw);

if(parsed&&parsed.version===2)
stats={...DEFAULTS,...parsed};
}

}catch(e){}
}

renderStats();

}

function modeName(){
return mode==='2p'?'TWO PLAYERS':mode.toUpperCase()+' AI';
}

function setTurnText(text,sub=''){

statusEl.innerHTML='';
statusEl.append(document.createTextNode(text));

if(sub){
const small=document.createElement('small');
small.textContent=sub;
statusEl.append(small);
}

}

function renderBoard(){

boardEl.innerHTML='';

cells.forEach((v,i)=>{

const b=document.createElement('button');

b.type='button';

b.className=
'cell'+
(v?' '+v.toLowerCase():'')+
(v?' pop':'')+
(winningLine.includes(i)?' winner':'');

b.setAttribute('role','gridcell');

b.setAttribute(
'aria-label',
`Square ${i+1}: ${v||'empty'}`
);

b.disabled=!!v||over||thinking||paused;

b.textContent=v;

b.addEventListener('click',()=>move(i));

boardEl.appendChild(b);

});

}

function startRound(){

clearTimeout(aiTimer);

cells=Array(9).fill('');
turn='X';
over=false;
thinking=false;
winningLine=[];
hintAvailable=false;

resultEl.textContent='';

setTurnText("X's turn",'Choose a square');

$('modeLabel').textContent=modeName();

setNotice('');

$('hintBtn').disabled=false;

renderBoard();

}

function startMode(m){

mode=m;

home.classList.add('hidden');
game.classList.remove('hidden');

startRound();

}

function check(c){

for(const line of WINS){

const [a,b,d]=line;

if(c[a]&&c[a]===c[b]&&c[a]===c[d])
return {winner:c[a],line};

}

if(c.every(Boolean))
return {winner:'draw',line:[]};

return null;

}

function available(c=cells){

return c.map((v,i)=>v?null:i).filter(i=>i!==null);

}

function winningMove(player,c=cells){

for(const i of available(c)){

const copy=c.slice();
copy[i]=player;

const r=check(copy);

if(r&&r.winner===player)
return i;

}

return -1;

}

function minimax(board,player){

const result=check(board);

if(result){

if(result.winner==='O')return {score:10};
if(result.winner==='X')return {score:-10};

return {score:0};

}

let best=player==='O'
?{score:-Infinity,index:-1}
:{score:Infinity,index:-1};

for(const i of available(board)){

const next=board.slice();
next[i]=player;

const res=minimax(next,player==='O'?'X':'O');

res.index=i;

if(player==='O'?res.score>best.score:res.score<best.score)
best=res;

}

return best;

}

function aiMove(){

const av=available();

if(!av.length)return -1;

if(mode==='easy')
return av[Math.floor(Math.random()*av.length)];

const win=winningMove('O');

if(win>=0)return win;

const block=winningMove('X');

if(block>=0)return block;

if(mode==='medium'){

if(!cells[4])return 4;

const corners=[0,2,6,8].filter(i=>!cells[i]);

if(corners.length)
return corners[Math.floor(Math.random()*corners.length)];

return av[Math.floor(Math.random()*av.length)];

}

return minimax(cells,'O').index;

}

function move(i){

if(paused||over||thinking||cells[i]||(mode!=='2p'&&turn==='O'))
return;

cells[i]=turn;

playMove(turn==='O');

afterMove();

}

function afterMove(){

const r=check(cells);

if(r){
finish(r);
return;
}

turn=turn==='X'?'O':'X';

renderBoard();

if(mode!=='2p'&&turn==='O'){

thinking=true;

setTurnText(
'AI is thinking…',
'Your move is being considered'
);

renderBoard();

aiTimer=setTimeout(()=>{

if(!paused&&!over){

const i=aiMove();

if(i>=0)cells[i]='O';

thinking=false;

afterMove();

}

},320);

}else{

setTurnText(turn+"'s turn",'Choose a square');

}

}

async function maybeInterstitial(){

roundsSinceAd++;

if(isBridge()&&roundsSinceAd>=3){

roundsSinceAd=0;

try{
if(bridge.advertisement.isInterstitialSupported)
await bridge.advertisement.showInterstitial('round_completed');
}catch(e){}

}

}

function finish(r){

over=true;
winningLine=r.line||[];

renderBoard();

if(r.winner==='draw'){

resultEl.textContent='It’s a draw!';

stats.draws++;

playDraw();

setTurnText(
'Well played!',
'Nobody takes this round'
);

}else{

resultEl.textContent=r.winner+' wins!';

playWin();

if(mode==='2p'){
if(r.winner==='X')stats.wins++;
else stats.losses++;
}else if(r.winner==='X'){
stats.wins++;
}else{
stats.losses++;
}

setTurnText(
'Round complete',
'Start another round when ready'
);

}

renderStats();
saveStats();
maybeInterstitial();

}

async function showHintAd(){

if(!isBridge()||!bridge.advertisement.isRewardedSupported){

setNotice('Rewarded ads are not available in this preview.');
return;

}

if(over||paused||thinking){

setNotice('Finish or resume the round first.');
return;

}

if(hintAvailable){

setNotice('You already used this round’s hint.');
return;

}

setNotice('Loading rewarded video…');

const onState=state=>{

if(state==='rewarded'){

hintAvailable=true;

const best=mode==='2p'
?winningMove('X')
:winningMove('X');

const moveIndex=best>=0
?best
:(mode==='hard'?minimax(cells,turn).index:available()[0]);

setNotice(
moveIndex>=0
?`Hint: try square ${moveIndex+1}.`
:'No hint available right now.'
);

}else if(state==='failed'||state==='closed'){

setNotice('Ad not completed. No hint was added.');

}

};

try{

bridge.advertisement.on(
bridge.EVENT_NAME.REWARDED_STATE_CHANGED,
onState
);

bridge.advertisement.showRewarded('hint');

}catch(e){

setNotice('Rewarded video is not available right now.');

}

}

function setPaused(value){

paused=!!value;

pauseOverlay.classList.toggle('hidden',!paused);

if(paused){

clearTimeout(aiTimer);
renderBoard();

}else{

if(mode!=='2p'&&turn==='O'&&!over){

thinking=true;
renderBoard();

aiTimer=setTimeout(()=>{

if(!paused&&!over){

const i=aiMove();

if(i>=0)cells[i]='O';

thinking=false;

afterMove();

}

},320);

}else{

renderBoard();

}

}

}

document.querySelectorAll('[data-mode]').forEach(b=>
b.addEventListener('click',()=>startMode(b.dataset.mode))
);

$('newRound').addEventListener('click',startRound);

$('backBtn').addEventListener('click',async()=>{

game.classList.add('hidden');
home.classList.remove('hidden');

await maybeInterstitial();

renderStats();

});

$('pauseBtn').addEventListener('click',()=>setPaused(true));

$('resumeBtn').addEventListener('click',()=>setPaused(false));

$('hintBtn').addEventListener('click',showHintAd);

$('soundBtn').addEventListener('click',()=>{

soundOn=!soundOn;

updateSoundButton();

try{
localStorage.setItem('ttt_sound_on',soundOn?'1':'0');
}catch(e){}

if(soundOn)
beep(740,.09,'sine',.035);

});

try{
soundOn=localStorage.getItem('ttt_sound_on')!=='0';
}catch(e){}

updateSoundButton();

async function initBridge(){

if(!window.bridge||typeof window.bridge.initialize!=='function'){

bridgeReady=false;
await loadStats();
return;

}

try{

bridge=window.bridge;

await bridge.initialize();

bridgeReady=true;

if(bridge.platform&&bridge.platform.on&&bridge.EVENT_NAME){

bridge.platform.on(
bridge.EVENT_NAME.PAUSE_STATE_CHANGED,
pausedState=>setPaused(!!pausedState)
);

}

await loadStats();

}catch(e){

bridgeReady=false;
await loadStats();

}

}

renderStats();
renderBoard();

initBridge().finally(()=>{});

})();
</script>

</body>
</html>
